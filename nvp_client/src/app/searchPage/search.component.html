<div class="search-container">
  <div class="search-card">
    <h2>Search machines</h2>

    <div class="form-row">
      <label>Name:</label>
      <input type="text" [(ngModel)]="qName" name="qName" placeholder="Part of name">
    </div>

    <div class="form-row">
      <label>Type:</label>
      <select [(ngModel)]="qType" name="qType">
        <option value="all">All</option>
        <option value="LINUX">Linux</option>
        <option value="WINDOWS">Windows</option>
        <option value="MAC">MacOS</option>
      </select>
    </div>

    <div class="form-row">
      <label>State:</label>
      <select [(ngModel)]="qState" name="qState">
        <option value="all">All</option>
        <option value="RUNNING">Running</option>
        <option value="STOPPED">Stopped</option>
        <option value="RESTARTING">Restarting</option>
      </select>
    </div>

    <div class="buttons-row">
      <button (click)="search()" class="btn-search">Search</button>
      <button (click)="reset()"  class="btn-reset">Reset</button>
    </div>
  </div>

  <div class="results-card">
    <h3>Results ({{ results.length }})</h3>

    <table class="results-table" *ngIf="results.length">
      <thead>
        <tr>
          <th>Name</th>
          <th>Status</th>
          <th>Used</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let m of results">
          <td>{{ m.name }}</td>
          <td>{{ m.status ? 'Active' : 'Deleted' }}</td>
          <td>{{ m.availability }}</td>
          <td>{{ formatDisplayDate(m.createdAt) }}</td>
          <td>
            <button (click)="turnOn(m)" [disabled]="!canTurnOn(m)" class="btn-upali">Upali</button>
            <button (click)="turnOff(m)" [disabled]="!canTurnOff(m)" class="btn-ugasi">Ugasi</button>
            <button (click)="restart(m)" [disabled]="!canRestart(m)" class="btn-restart">Restartuj</button>
            <button (click)="destroy(m)" [disabled]="!canDestroy(m)" class="btn-unisti">Uništi</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="results && results.length === 0" class="no-results">
      No results found.
    </div>
  </div>
</div>
