<div class="search-container">

  <app-header></app-header>

  <div class="search-card">
    <h2>Search machines</h2>

    <div class="form-row">
      <label>Name:</label>
      <input type="text" [(ngModel)]="qName" name="qName" placeholder="Part of name">
    </div>

    <div class="form-row">
      <label>Type:</label>
      <select [(ngModel)]="qType" name="qType">
        <option value="all">All</option>
        <option value="LINUX">Linux</option>
        <option value="WINDOWS">Windows</option>
        <option value="MAC">MacOS</option>
      </select>
    </div>

    <div class="form-row">
      <label>State:</label>
      <select [(ngModel)]="qState" name="qState">
        <option value="all">All</option>
        <option value="RUNNING">Running</option>
        <option value="STOPPED">Stopped</option>
        <option value="RESTARTING">Restarting</option>
      </select>
    </div>

    <div class="buttons-row">
      <button (click)="search()" class="btn-search">Search</button>
      <button (click)="reset()"  class="btn-reset">Reset</button>
    </div>
  </div>

  <div class="results-card">
  <h3>Machines ({{ machines.length }})</h3>

  <table class="results-table" *ngIf="machines.length">
    <thead>
      <tr>
        <th>Name</th>
        <th>Type</th>
        <th>State</th>
        <th>Active</th>
        <th>Description</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of machines">
        <td>{{ m.name }}</td>
        <td>{{ m.type }}</td>
        <td>{{ m.state }}</td>
        <td>{{ m.active ? 'Yes' : 'No' }}</td>
        <td>{{ m.description }}</td>
    <td class="actions">
  <button (click)="turnOn(m)"
          *ngIf="auth.hasPermission('STARTING_MACHINE')"
          [disabled]="isDisabled(m) || !canTurnOn(m)"
          class="btn-upali">Upali</button>

  <button (click)="turnOff(m)"
          *ngIf="auth.hasPermission('STOPPING_MACHINE')"
          [disabled]="isDisabled(m) || !canTurnOff(m)"
          class="btn-ugasi">Ugasi</button>

  <button (click)="restart(m)"
          *ngIf="auth.hasPermission('RESTARTING_MACHINE')"
          [disabled]="isDisabled(m) || !canRestart(m)"
          class="btn-restart">Restartuj</button>

  <button (click)="destroy(m)"
          *ngIf="auth.hasPermission('DESTROYING_MACHINE')"
          [disabled]="isDisabled(m) || !canDestroy(m)"
          class="btn-unisti">Uništi</button>

  <button (click)="goToSchedule(m)"
          *ngIf="auth.hasPermission('SCHEDULING_MACHINE')"
          [disabled]="isDisabled(m)"
          class="btn-zakazi">Zakaži</button>
</td>
        </tr>
      </tbody>
    </table>

 
  <div *ngIf="!machines.length" class="no-results">
    No machines found.
  </div>
</div>
