<div class="search-container">
  <div class="search-card">
    <h2>Search machines</h2>

    <div class="form-row">
      <label>Name:</label>
      <input type="text" [(ngModel)]="qName" name="qName" placeholder="Part of name">
    </div>

    <div class="form-row">
      <label>Type:</label>
      <select [(ngModel)]="qType" name="qType">
        <option value="all">All</option>
        <option value="LINUX">Linux</option>
        <option value="WINDOWS">Windows</option>
        <option value="MAC">MacOS</option>
      </select>
    </div>

    <div class="form-row">
      <label>State:</label>
      <select [(ngModel)]="qState" name="qState">
        <option value="all">All</option>
        <option value="RUNNING">Running</option>
        <option value="STOPPED">Stopped</option>
        <option value="RESTARTING">Restarting</option>
      </select>
    </div>

    <div class="buttons-row">
      <button (click)="search()" class="btn-search">Search</button>
      <button (click)="reset()"  class="btn-reset">Reset</button>
    </div>
  </div>

  <div class="results-card">
    <h3>Results ({{ results.length }})</h3>

    <table class="results-table" *ngIf="results.length">
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>State</th>
          <th>Active</th>
          <th>Description</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let m of results">
          <td>{{ m.name }}</td>
          <td>{{ m.type }}</td>
          <td>{{ m.state }}</td>
          <td>{{ m.active ? 'Yes' : 'No' }}</td>
          <td>{{ m.description }}</td>
          <td class="actions">
            <!-- add the methods below or remove buttons until implemented -->
            <button (click)="start(m)"  [disabled]="m.state === 'RUNNING'"  class="btn-primary">Start</button>
            <button (click)="stop(m)"   [disabled]="m.state === 'STOPPED'"   class="btn-primary">Stop</button>
            <button (click)="restart(m)" [disabled]="m.state === 'RESTARTING'" class="btn-primary">Restart</button>
            <button (click)="delete(m)"  class="btn-danger">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="!results.length" class="no-results">
      No machines found.
    </div>
  </div>
</div>
