<div class="login-container">
  <div class="card">
    <h1 class="page-title">Welcome to RAF cloud</h1>

    <form>
      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="yours@exemple.com" required />
      </div>

      <div class="form-row">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter a password" required />
      </div>

      <div class="submit-row">
        <button type="submit">Log in</button>
      </div>
    </form>
  </div>
</div>
