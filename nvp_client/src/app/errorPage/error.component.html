<div class="error-log-container">

  <app-header></app-header>

  <h2>Error's history</h2>

  <table class="error-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Machine ID</th>
        <th>Operation</th>
        <th>Message</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let err of errors">
        <td>{{ err.date | date:'dd.MM.yyyy.' }}</td>
        <td>{{ err.machineId }}</td>
        <td>{{ err.operation }}</td>
        <td>{{ err.message }}</td>
      </tr>
    </tbody>
  </table>
</div>
