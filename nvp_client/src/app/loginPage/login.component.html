<div class="login-container">
  <div class="card">
    <h1 class="page-title">Welcome to RAF cloud</h1>

    <form (ngSubmit)="login()">
      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="yours@example.com" required [(ngModel)]="email" />
      </div>

      <div class="form-row">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter a password" required [(ngModel)]="password" />
      </div>

      <div class="submit-row">
        <button type="submit">Log in</button>
      </div>
      <div *ngIf="errorMessage" class="error-msg">
        {{ errorMessage }}
      </div>
    </form>
  </div>
</div>
